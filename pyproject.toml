[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcdonalds-financial-forecast"
version = "1.0.0"
description = "McDonald's Financial Forecast Dashboard - Interactive Streamlit application for financial analysis, ratio analysis, segment reporting, and 5-year scenario-based forecasting (2019-2023) with outcome validation."
authors = [{ name = "Pranav J" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 120  # Slightly relaxed for data-heavy files
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F", "I"]  # Critical rules only: syntax errors (E9), Pyflakes (F), isort (I)
ignore = ["E501", "W291", "W293", "E302", "E305"]  # Ignore line length, trailing whitespace, blank line issues common in large data tables

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
